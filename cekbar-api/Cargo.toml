[package]
name = "cekbar-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "json", "migrate"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.6"
bcrypt = "0.17"

# HTTP client (external APIs)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Scheduling
tokio-cron-scheduler = "0.13"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Decimal (prices)
rust_decimal = { version = "1", features = ["serde"] }

# Regex (lightweight)
regex-lite = "0.1"

# Async trait
async-trait = "0.1"

# SSE streaming
futures-util = "0.3"
async-stream = "0.3"

# Thiserror
thiserror = "2"

